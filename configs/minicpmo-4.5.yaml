model: MiniCPM-o-4.5
prefill:
  llm: flash_attention_2
  vision: flash_attention_2
  audio: sdpa

r2omni:
  stc: stc.yaml
  layer_group_size: 4
  matched_fp_until_layer: 0
  shallow_v_payload_bit_ceiling: 2.1
  deep_v_payload_bit_ceiling: 2.0
  value_int2_group_size: 128
  key_quantization_superblock: 128

oscar:
  num_bits: 2
  quant_mode: k-channel
  group_size: 32
  residual_block_size: 128
  kv_rotation: hadamard
  kv_norm: "1"
  offline_v_hadamard: true
  decode_backend: official_cuda_packed

kivi-om:
  implementation: official
  k_bits: 2
  v_bits: 2
  group_size: 128
  residual_length: 384
  fp_prefix_layers: 0
  readout_backend: native_packed

ott-om:
  k_bits: 2
  v_bits: 2
  group_size: 128
  residual_length: 256
  sink_num: 3
  sink_max_size: 32
  fp_prefix_layers: 0
  readout_backend: native_packed
